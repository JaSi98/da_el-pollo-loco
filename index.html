<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./img/favicon.png" type="image/x-icon">
    <title>El Pollo Loco</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="fonts.css">
    <script src="./models/drawable-object.class.js"></script>
    <script src="./models/statusbar.class.js"></script>
    <script src="./models/coinbar.class.js"></script>
    <script src="./models/bottlebar.class.js"></script>
    <script src="./models/world.class.js"></script>
    <script src="./models/moveable-object.class.js"></script>
    <script src="./models/throwable-object.class.js"></script>
    <script src="./models/bottle.class.js"></script>
    <script src="./models/chicken.class.js"></script>
    <script src="./models/endboss.class.js"></script>
    <script src="./models/cloud.class.js"></script>
    <script src="./models/character.class.js"></script>
    <script src="./models/background-object.class.js"></script>
    <script src="./models/keyboard.class.js"></script>
    <script src="./models/level.class.js"></script>
    <script src="./models/coin.class.js"></script>
    <script src="./js/game.js"></script>
    <script src="./js/cutscene.js"></script>
    <script src="./levels/level1.js"></script>
    <script src="./levels/level2.js"></script>
</head>

<body onload="init();">
    <div class="canvas-layout">
        <canvas class="canvas" width="1080" height="720" id="canvas">
        </canvas>
        <canvas class="canvas cutscene-canvas d-none" width="1080" height="720" id="cutsceneCanvas">
        </canvas>
        <img id="no_mute" class="sound_btn d-none" src="./img/sound.svg" alt="Ton an" onclick="manageAudio();">
        <img id="mute" class="sound_btn d-none" src="./img/no_sound.svg" alt="Ton aus" onclick="manageAudio();">
        <div class="hint">
            <h3>Steuerung</h3>
            <p>Laufen mit den Pfeiltasten nach Links und rechts. Springen mit Space und Werfen der Flaschen mit D</p>
        </div>
        <div id="buttons" class="buttons">
            <div class="move">
                <!-- Button for LEFT -->
                <button id="button-left" class="buttonGame">LEFT</button>

                <!-- Button for RIGHT -->
                <button id="button-right" class="buttonGame">RIGHT</button>

                <!-- Button for SPACE (Jump) -->
                <button id="button-space" class="buttonGame" style="width: 400px;">JUMP</button>

                <!-- Button for D (Throw) -->
                <button id="button-d" class="buttonGame">THROW</button>
            </div>
        </div>
        <div class="gameOver d-none" id="gameOver"></div>
        <div class="winner d-none" id="winner"></div>
        <button id="replay" class="replay d-none" onclick="resetGame();">Replay</button>
        <div id="letterboxTop" class="letterbox letterbox-top d-none"></div>
        <div id="letterboxBottom" class="letterbox letterbox-bottom d-none"></div>
        <div id="dialogue" class="dialogue d-none" onclick="advanceDialogue();">
            <p id="dialogueText"></p>
            <span class="dialogue-hint">weiter mit Leertaste</span>
        </div>
        <div id="startScreen" class="start-screen">
            <button id="playButton" class="play-button" onclick="startGame();">Spiel starten</button>
        </div>
    </div>
