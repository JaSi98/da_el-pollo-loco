<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="El Pollo Loco – ein Jump-and-Run-Spiel mit Pepe, Salsa-Flaschen und verrückten Hühnern. Spielbar am Computer, Tablet und Smartphone.">
    <meta name="theme-color" content="#1c1206">
    <link rel="icon" href="./img/favicon.png" type="image/png">
    <title>El Pollo Loco</title>
    <link rel="stylesheet" href="fonts.css">
    <link rel="stylesheet" href="style.css">
    <script src="./models/drawable-object.class.js"></script>
    <script src="./models/statusbar.class.js"></script>
    <script src="./models/coinbar.class.js"></script>
    <script src="./models/bottlebar.class.js"></script>
    <script src="./models/world.class.js"></script>
    <script src="./models/moveable-object.class.js"></script>
    <script src="./models/throwable-object.class.js"></script>
    <script src="./models/bottle.class.js"></script>
    <script src="./models/chicken.class.js"></script>
    <script src="./models/endboss.class.js"></script>
    <script src="./models/cloud.class.js"></script>
    <script src="./models/character.class.js"></script>
    <script src="./models/background-object.class.js"></script>
    <script src="./models/keyboard.class.js"></script>
    <script src="./models/level.class.js"></script>
    <script src="./models/coin.class.js"></script>
    <script src="./js/game.js"></script>
    <script src="./js/cutscene.js"></script>
    <script src="./levels/level1.js"></script>
    <script src="./levels/level2.js"></script>
</head>

<body onload="init();">
    <main id="app" class="app">
        <section class="stage" aria-label="Spielfeld">
            <canvas class="canvas" width="1080" height="720" id="canvas"></canvas>
            <canvas class="canvas d-none" width="1080" height="720" id="cutsceneCanvas"></canvas>

            <div class="toolbar">
                <button id="mute" class="icon-button d-none" type="button" onclick="manageAudio();"
                    aria-label="Ton ausschalten" title="Ton ausschalten">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M4 9v6h4l5 4V5L8 9H4Z" />
                        <path class="stroke" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" />
                    </svg>
                </button>
                <button id="no_mute" class="icon-button d-none" type="button" onclick="manageAudio();"
                    aria-label="Ton einschalten" title="Ton einschalten">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M4 9v6h4l5 4V5L8 9H4Z" />
                        <path class="stroke" d="m16 9.5 5 5m0-5-5 5" />
                    </svg>
                </button>
                <button id="fullscreenButton" class="icon-button d-none" type="button" onclick="toggleFullscreen();"
                    aria-label="Vollbild" title="Vollbild">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path class="stroke" d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" />
                    </svg>
                </button>
            </div>

            <div class="touch-controls touch-controls--overlay" aria-hidden="true">
                <div class="touch-controls__group">
                    <button class="touch-button" type="button" data-key="LEFT" tabindex="-1">
                        <svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7" class="stroke" /></svg>
                    </button>
                    <button class="touch-button" type="button" data-key="RIGHT" tabindex="-1">
                        <svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7" class="stroke" /></svg>
                    </button>
                </div>
                <div class="touch-controls__group">
                    <button class="touch-button touch-button--action" type="button" data-key="D" tabindex="-1">
                        <img src="./img/6_salsa_bottle/salsa_bottle.png" alt="">
                    </button>
                    <button class="touch-button touch-button--action" type="button" data-key="SPACE" tabindex="-1">
                        <svg viewBox="0 0 24 24"><path d="m5 15 7-7 7 7" class="stroke" /></svg>
                    </button>
                </div>
            </div>

            <div class="gameOver d-none" id="gameOver"></div>
            <div class="winner d-none" id="winner"></div>
            <button id="replay" class="button replay d-none" type="button" onclick="resetGame();">Nochmal spielen</button>
            <div id="letterboxTop" class="letterbox letterbox-top d-none"></div>
            <div id="letterboxBottom" class="letterbox letterbox-bottom d-none"></div>
            <div id="dialogue" class="dialogue d-none" onclick="advanceDialogue();">
                <p id="dialogueText"></p>
                <span class="dialogue-hint dialogue-hint--keyboard">weiter mit Leertaste</span>
                <span class="dialogue-hint dialogue-hint--touch">tippen zum Weiterlesen</span>
            </div>

            <div id="startScreen" class="start-screen">
                <button id="playButton" class="button play-button" type="button" onclick="startGame();">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7L8 5Z" /></svg>
                    Spiel starten
                </button>
            </div>
        </section>

        <div class="touch-controls touch-controls--pad" aria-hidden="true">
            <div class="touch-controls__group">
                <button class="touch-button" type="button" data-key="LEFT" tabindex="-1">
                    <svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7" class="stroke" /></svg>
                </button>
                <button class="touch-button" type="button" data-key="RIGHT" tabindex="-1">
                    <svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7" class="stroke" /></svg>
                </button>
            </div>
            <div class="touch-controls__group">
                <button class="touch-button touch-button--action" type="button" data-key="D" tabindex="-1">
                    <img src="./img/6_salsa_bottle/salsa_bottle.png" alt="">
                </button>
                <button class="touch-button touch-button--action" type="button" data-key="SPACE" tabindex="-1">
                    <svg viewBox="0 0 24 24"><path d="m5 15 7-7 7 7" class="stroke" /></svg>
                </button>
            </div>
        </div>

        <p class="rotate-hint">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect class="stroke" x="7" y="3" width="10" height="18" rx="2" />
                <path class="stroke" d="M20 14a8 8 0 0 1-5 6" />
            </svg>
            Dreh dein Gerät quer für ein größeres Spielfeld.
        </p>

        <footer class="footer">
            <ul class="controls-help" aria-label="Steuerung">
                <li><kbd>←</kbd><kbd>→</kbd> laufen</li>
                <li><kbd>Leertaste</kbd> springen</li>
                <li><kbd>D</kbd> Flasche werfen</li>
            </ul>
            <nav class="legal-links" aria-label="Rechtliches">
                <a href="./impressum.html">Impressum</a>
                <a href="./datenschutz.html">Datenschutz</a>
            </nav>
        </footer>
    </main>
</body>

</html>
